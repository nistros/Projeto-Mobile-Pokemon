<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Chatbot AI - Aplicação Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Material+Icons" rel="stylesheet" />
  <style>
    /* RESET E BASE */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      height: 100vh;
      display: grid;
      grid-template-rows: 64px 1fr auto;
      overflow: hidden;
    }
    /* VARIAVEIS DE TEMA */
    :root {
      --color-primary: #6366f1;
      --color-primary-dark: #4f46e5;
      --color-accent: #06b6d4;
      --color-bg-light: #f3f4f6;
      --color-bg-dark: #121212;
      --color-text-light: #f9fafb;
      --color-text-dark: #1f2937;
      --bg-gradient-light: linear-gradient(135deg, #e0e7ff 0%, #a5b4fc 100%);
      --bg-gradient-dark: linear-gradient(135deg, #1f2937 0%, #4b5563 100%);
      --shadow-glass: rgba(255 255 255 / 0.1);
      --shadow-dark: rgba(0 0 0 / 0.6);

      --toast-bg: var(--color-primary-dark);
      --toast-text: var(--color-text-light);

      --radius: 12px;
      --transition: 0.3s ease-out;
    }
    /* TEMA ESCURO */
    body[data-theme="dark"] {
      --bg-gradient: var(--bg-gradient-dark);
      --text-primary: var(--color-text-light);
      --bg-base: var(--color-bg-dark);
      --input-bg: #1f2937;
      --card-bg: rgba(31, 41, 55, 0.85);
      --border-color: #374151;
    }
    /* TEMA CLARO */
    body[data-theme="light"] {
      --bg-gradient: var(--bg-gradient-light);
      --text-primary: var(--color-text-dark);
      --bg-base: var(--color-bg-light);
      --input-bg: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border-color: #d1d5db;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      height: 64px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      box-shadow:
        0 1px 2px var(--shadow-glass),
        0 0 20px var(--shadow-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }
    header .brand {
      font-weight: 700;
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      color: var(--color-primary);
      user-select: none;
      letter-spacing: 0.03em;
    }
    header nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    header nav button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 28px;
      line-height: 1;
      padding: 4px;
      border-radius: 50%;
      transition: background-color var(--transition);
      user-select: none;
      position: relative;
    }
    header nav button:focus-visible {
      outline: 2px solid var(--color-primary);
    }
    header nav button:hover {
      background: var(--color-primary-dark);
    }
    header nav .material-icons {
      vertical-align: middle;
      font-size: 28px !important;
    }
    header nav .badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 600;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      user-select: none;
    }

    /* LAYOUT PRINCIPAL: SIDEBAR + MAIN */
    .layout {
      display: flex;
      height: calc(100vh - 64px);
      overflow: hidden;
      background: var(--bg-base);
    }
    /* SIDEBAR */
    aside.sidebar {
      width: 280px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 16px;
      transform: translateX(0);
      transition: transform 0.3s ease-out;
      z-index: 10;
    }
    aside.sidebar.collapsed {
      transform: translateX(-100%);
    }
    aside.sidebar header {
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--color-primary);
      margin-bottom: 24px;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    aside.sidebar header button {
      font-size: 20px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-primary);
      user-select: none;
      border-radius: 50%;
      padding: 2px;
    }
    aside.sidebar nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--color-primary) transparent;
    }
    aside.sidebar nav a {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      border-radius: var(--radius);
      color: var(--text-primary);
      transition: background-color var(--transition);
      position: relative;
    }
    aside.sidebar nav a .material-icons {
      font-size: 24px;
      color: var(--color-primary);
    }
    aside.sidebar nav a.active,
    aside.sidebar nav a:hover {
      background: var(--color-primary);
      color: #fff;
    }
    aside.sidebar nav a.active .material-icons,
    aside.sidebar nav a:hover .material-icons {
      color: #fff;
    }
    aside.sidebar nav a .badge {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: #ef4444;
      font-size: 12px;
      width: 20px;
      height: 20px;
      line-height: 20px;
      border-radius: 50%;
      font-weight: 700;
      user-select: none;
      text-align: center;
    }
    aside.sidebar::-webkit-scrollbar {
      width: 8px;
    }
    aside.sidebar::-webkit-scrollbar-thumb {
      background-color: var(--color-primary);
      border-radius: 20px;
    }

    /* MAIN CONTENT */
    main.content {
      flex: 1;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-height: calc(100vh - 64px);
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--color-primary) transparent;
      position: relative;
    }
    main.content::-webkit-scrollbar {
      width: 10px;
    }
    main.content::-webkit-scrollbar-thumb {
      background-color: var(--color-primary);
      border-radius: 20px;
    }

    /* CHAT WINDOW */
    .chat-window {
      display: flex;
      flex-direction: column;
      flex: 1;
      border-radius: var(--radius);
      background: var(--card-bg);
      padding: 16px;
      box-shadow:
        0 8px 16px rgba(0,0,0,0.08);
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .chat-message {
      max-width: 75%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: var(--radius);
      font-size: clamp(0.9rem, 1vw, 1rem);
      line-height: 1.4;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      word-break: break-word;
      position: relative;
      animation: fadeInUp 0.3s ease forwards;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-message.user {
      align-self: flex-end;
      background: var(--color-primary);
      color: white;
      border-bottom-right-radius: 0;
      box-shadow:
        0 6px 12px rgba(99,102,241,0.5);
    }
    .chat-message.bot {
      align-self: flex-start;
      background: var(--color-bg-light);
      color: var(--color-text-dark);
      border-bottom-left-radius: 0;
    }

    /* FORM DE ENTRADA */
    form.chat-input-form {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }
    form.chat-input-form input[type="text"] {
      flex: 1;
      border-radius: 32px;
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      font-size: 1rem;
      color: var(--text-primary);
      background: var(--input-bg);
      transition: border-color var(--transition);
      outline-offset: 2px;
    }
    form.chat-input-form input[type="text"]:focus {
      border-color: var(--color-primary);
      outline: none;
    }
    form.chat-input-form button {
      background: var(--color-primary);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      font-size: 28px;
      transition: background-color var(--transition);
      user-select: none;
    }
    form.chat-input-form button:hover {
      background: var(--color-primary-dark);
    }
    form.chat-input-form button:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
    }

    /* FOOTER */
    footer {
      height: auto;
      background: var(--card-bg);
      padding: 14px 24px;
      backdrop-filter: blur(12px);
      box-shadow:
        0 -2px 8px var(--shadow-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--color-primary);
      user-select: none;
      flex-wrap: wrap;
      gap: 8px;
    }
    footer .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    footer .status .material-icons {
      font-size: 18px;
      color: #22c55e;
    }
    footer .social {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    footer .social a {
      color: var(--color-primary);
      text-decoration: none;
      font-size: 24px;
      transition: color var(--transition);
    }
    footer .social a:hover {
      color: var(--color-primary-dark);
    }

    /* TOAST NOTIFICAÇÕES */
    .toast-container {
      position: fixed;
      top: 72px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
      max-width: 320px;
    }
    .toast {
      background: var(--toast-bg);
      color: var(--toast-text);
      border-radius: var(--radius);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow:
        0 6px 15px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      will-change: transform, opacity;
      animation: slideInRight 0.4s cubic-bezier(.41,.73,.51,1.02);
      user-select: none;
    }
    .toast .material-icons {
      font-size: 24px;
      flex-shrink: 0;
    }
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100%);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* MEDIA QUERIES RESPONSIVOS */
    @media (max-width: 767px) {
      aside.sidebar {
        position: fixed;
        top: 64px;
        left: 0;
        height: calc(100% - 64px);
        background: var(--card-bg);
        z-index: 110;
        transform: translateX(-100%);
        transition: transform 0.3s ease-out;
        box-shadow: 4px 0 12px rgba(0,0,0,0.15);
        width: 280px;
      }
      aside.sidebar.open {
        transform: translateX(0);
      }
      .layout {
        flex-direction: column;
        height: auto;
      }
      main.content {
        height: calc(100vh - 64px - 48px);
        padding: 16px;
      }
      footer {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px;
        font-size: 0.9rem;
      }
      header nav button.menu-toggle {
        display: inline-flex;
      }
    }
    @media(min-width: 768px) and (max-width: 1023px) {
      aside.sidebar {
        width: 280px;
        transform: none !important;
        position: relative;
        height: auto;
        box-shadow: none;
      }
      .layout {
        flex-direction: row;
      }
      main.content {
        padding: 24px 32px;
      }
      header nav button.menu-toggle {
        display: none;
      }
    }
    @media(min-width: 1024px) {
      header nav button.menu-toggle {
        display: none;
      }
      aside.sidebar {
        position: relative;
        transform: none !important;
        box-shadow: none;
      }
    }
  </style>
</head>
<body data-theme="light" aria-label="Aplicativo Chatbot com painel lateral e tema claro ou escuro" >
  <header role="banner">
    <div class="brand" aria-label="Marca da aplicação AI Chatbot">Chatbot AI</div>
    <nav role="navigation" aria-label="Controles do site">
      <button class="menu-toggle material-icons" aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="sidebar">menu</button>
      <button id="btnTheme" aria-label="Alternar tema claro e escuro" title="Alternar tema claro e escuro" role="button" type="button">
        <span class="material-icons" aria-hidden="true">brightness_6</span>
      </button>
      <button id="btnNotification" aria-label="Exibir notificações" title="Exibir notificações" role="button" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="material-icons" aria-hidden="true">notifications</span>
        <span class="badge" aria-hidden="true" id="notifCount">3</span>
      </button>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" role="complementary" aria-label="Navegação principal">
      <header>
        Menu
        <button aria-label="Fechar menu" title="Fechar menu" id="btnCloseSidebar" type="button" class="material-icons">close</button>
      </header>
      <nav>
        <a href="#" class="active" tabindex="0"><span class="material-icons" aria-hidden="true">home</span> Início</a>
        <a href="#" tabindex="0"><span class="material-icons" aria-hidden="true">chat</span> Conversas <span class="badge" aria-label="10 mensagens não lidas">10</span></a>
        <a href="#" tabindex="0"><span class="material-icons" aria-hidden="true">settings</span> Configurações</a>
        <a href="#" tabindex="0"><span class="material-icons" aria-hidden="true">person</span> Perfil</a>
      </nav>
    </aside>

    <main class="content" role="main" tabindex="-1" aria-live="polite" aria-relevant="additions">
      <section class="chat-window" id="chatWindow" aria-label="Histórico de mensagens do chatbot" tabindex="0" role="log"></section>

      <form class="chat-input-form" aria-label="Enviar mensagem">
        <input
          type="text"
          id="chatInput"
          aria-label="Digite sua mensagem"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
          maxlength="500"
          required
        />
        <button type="submit" aria-label="Enviar mensagem" disabled>
          <span class="material-icons">send</span>
        </button>
      </form>
    </main>
  </div>

  <footer role="contentinfo">
    <div class="status" aria-live="polite" aria-atomic="true">
      <span class="material-icons" aria-hidden="true">check_circle</span>
      <span>Conectado</span>
    </div>
    <div class="social" role="navigation" aria-label="Redes sociais">
      <a href="https://github.com/" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub" tabindex="0"><span class="material-icons" aria-hidden="true">code</span></a>
      <a href="https://twitter.com" target="_blank" rel="noopener" aria-label="Twitter" title="Twitter" tabindex="0"><span class="material-icons" aria-hidden="true">twitter</span></a>
      <a href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn" tabindex="0"><span class="material-icons" aria-hidden="true">linkedin</span></a>
    </div>
  </footer>

  <div class="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script>
    (() => {
      'use strict';

      // Elementos principais
      const body = document.body;
      const sidebar = document.getElementById('sidebar');
      const btnTheme = document.getElementById('btnTheme');
      const btnNotification = document.getElementById('btnNotification');
      const notifCount = document.getElementById('notifCount');
      const menuToggle = document.querySelector('.menu-toggle');
      const btnCloseSidebar = document.getElementById('btnCloseSidebar');
      const chatInput = document.getElementById('chatInput');
      const chatWindow = document.getElementById('chatWindow');
      const chatForm = document.querySelector('.chat-input-form');
      const toastContainer = document.querySelector('.toast-container');

      // Estado da aplicação
      let currentTheme = localStorage.getItem('theme') || 'light';
      let notifications = [
        { id: 1, title: 'Bem-vindo!', content: 'Sistema iniciado com sucesso.', read: false, priority: 'normal' },
        { id: 2, title: 'Atualização', content: 'Nova funcionalidade de tema adicionada.', read: false, priority: 'high' },
        { id: 3, title: 'Dica', content: 'Use Ctrl+Enter para enviar rapidamente.', read: false, priority: 'normal' }
      ];

      // Dummy conversa inicial
      const initialMessages = [
        { id: 'b1', author: 'bot', text: 'Olá! Eu sou seu assistente AI. Como posso ajudar você hoje?' }
      ];

      // Atualiza tema visual e ar
      function applyTheme(theme) {
        currentTheme = theme;
        body.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        btnTheme.setAttribute('aria-pressed', theme === 'dark');
      }
      applyTheme(currentTheme);

      // Alterna tema claro/escuro
      btnTheme.addEventListener('click', () => {
        applyTheme(currentTheme === 'light' ? 'dark' : 'light');
        showToast(`Tema alterado para ${currentTheme === 'light' ? 'escuro' : 'claro'}`, 'info');
      });

      // Controle sidebar mobile
      menuToggle.addEventListener('click', () => {
        const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
        menuToggle.setAttribute('aria-expanded', !expanded);
        sidebar.classList.toggle('open');
      });
      btnCloseSidebar.addEventListener('click', () => {
        sidebar.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', false);
      });

      // Renderiza mensagens no chat
      function renderMessage(message) {
        const div = document.createElement('div');
        div.classList.add('chat-message', message.author);
        div.setAttribute('role', 'article');
        div.setAttribute('aria-label', message.author === 'user' ? 'Mensagem do usuário' : 'Mensagem do chatbot');
        div.tabIndex = 0;
        div.textContent = message.text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        div.focus();
      }

      // Renderiza todas mensagens iniciais
      function loadInitialMessages() {
        for (const msg of initialMessages) {
          renderMessage(msg);
        }
      }
      loadInitialMessages();

      // Validação da entrada: habilita botão enviar se não vazio
      chatInput.addEventListener('input', () => {
        chatForm.querySelector('button[type="submit"]').disabled = chatInput.value.trim() === '';
      });

      // Simula resposta AI com delay e animação
      function simulateAIResponse(userText) {
        return new Promise(resolve => {
          const responses = [
            "Interessante, me conte mais.",
            "Posso ajudar com isso.",
            "Vamos explorar isso juntos.",
            "Essa é uma boa pergunta!",
            "Vou buscar essa informação para você.",
            "Claro, aqui está o que encontrei.",
            "Pode explicar melhor, por favor?",
            "Estou aqui para ajudar."
          ];
          setTimeout(() => {
            const response = responses[Math.floor(Math.random() * responses.length)];
            resolve(response);
          }, 1100 + Math.random() * 900);
        });
      }

      // Exibe Toast Notification
      function showToast(message, type = 'info', duration = 4000) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.role = 'alert';
        toast.tabIndex = -1;
        toast.setAttribute('aria-live', 'assertive');
        toast.setAttribute('aria-atomic', 'true');
        const iconName = {
          info: 'info',
          success: 'check_circle',
          error: 'error'
        }[type] || 'info';
        toast.innerHTML = `<span class="material-icons" aria-hidden="true">${iconName}</span><div>${message}</div>`;
        toastContainer.appendChild(toast);
        toast.focus();

        function removeToast() {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(100%)';
          setTimeout(() => toast.remove(), 400);
        }
        setTimeout(removeToast, duration);

        toast.addEventListener('click', removeToast);
      }

      // Adiciona mensagem do usuário e responde AI
      async function handleSendMessage(text) {
        // Normaliza texto
        const trimmedText = text.trim();
        if (!trimmedText) return;

        // Renderiza mensagem do user
        renderMessage({ id: Date.now(), author: 'user', text: trimmedText });

        // Limpa input e desabilita botão
        chatInput.value = '';
        chatForm.querySelector('button[type="submit"]').disabled = true;

        // Anima loading de mensagem bot
        const botPlaceholder = { id: 'bot-loading', author: 'bot', text: '...' };
        renderMessage(botPlaceholder);

        // Resposta AI simulada
        try {
          const botResponse = await simulateAIResponse(trimmedText);

          // Remove placeholder anterior
          const loadingEl = chatWindow.querySelector('.chat-message.bot:last-child');
          if (loadingEl && loadingEl.textContent === '...') {
            loadingEl.textContent = botResponse;
          } else {
            renderMessage({ id: Date.now(), author: 'bot', text: botResponse });
          }

          showToast('Resposta recebida', 'success');
        } catch (err) {
          showToast('Erro ao processar a mensagem', 'error');
        }
      }

      // Envio do formulário
      chatForm.addEventListener('submit', event => {
        event.preventDefault();
        handleSendMessage(chatInput.value);
      });

      // Sistema de notificações - atualiza badge e controle de visibilidade
      function updateNotifications() {
        const unreadCount = notifications.filter(n => !n.read).length;
        notifCount.textContent = unreadCount;
        notifCount.style.display = unreadCount > 0 ? 'inline-block' : 'none';
      }
      updateNotifications();

      // Exibe lista de notificações simplificada
      btnNotification.addEventListener('click', () => {
        const dropdownId = 'notification-dropdown';
        let dropdown = document.getElementById(dropdownId);
        if (dropdown) {
          dropdown.remove();
          btnNotification.setAttribute('aria-expanded', 'false');
          return;
        }
        dropdown = document.createElement('div');
        dropdown.id = dropdownId;
        dropdown.style.position = 'absolute';
        dropdown.style.top = '64px';
        dropdown.style.right = '24px';
        dropdown.style.width = '320px';
        dropdown.style.maxHeight = '400px';
        dropdown.style.overflowY = 'auto';
        dropdown.style.background = 'var(--card-bg)';
        dropdown.style.border = `1px solid var(--border-color)`;
        dropdown.style.borderRadius = '12px';
        dropdown.style.boxShadow = '0 8px 24px rgba(0,0,0,0.15)';
        dropdown.style.zIndex = 9999;
        dropdown.setAttribute('role', 'list');
        dropdown.setAttribute('aria-label', 'Lista de notificações');

        if(notifications.length === 0) {
          const emptyMsg = document.createElement('div');
          emptyMsg.textContent = 'Você não tem notificações';
          emptyMsg.style.padding = '16px';
          dropdown.appendChild(emptyMsg);
        } else {
          notifications.forEach(n => {
            const item = document.createElement('div');
            item.setAttribute('role', 'listitem');
            item.tabIndex = 0;
            item.style.padding = '12px 16px';
            item.style.borderBottom = `1px solid var(--border-color)`;
            item.style.cursor = 'pointer';
            item.style.display = 'flex';
            item.style.flexDirection = 'column';
            item.style.gap = '2px';
            item.innerHTML = `
              <strong style="color: var(--color-primary);">${n.title}</strong>
              <span>${n.content}</span>
            `;
            item.addEventListener('click', () => {
              n.read = true;
              updateNotifications();
              showToast(`Notificação "${n.title}" marcada como lida.`, 'success');
              dropdown.remove();
              btnNotification.setAttribute('aria-expanded', 'false');
            });
            dropdown.appendChild(item);
          });
        }
        document.body.appendChild(dropdown);
        btnNotification.setAttribute('aria-expanded', 'true');
      });

      // Atalhos de teclado
      window.addEventListener('keydown', event => {
        if (event.ctrlKey && event.key === 'Enter') {
          event.preventDefault();
          if (!chatForm.querySelector('button[type="submit"]').disabled) {
            handleSendMessage(chatInput.value);
          }
        }
      });

      // Inicialização avançada futura, se necessário
    })();
  </script>
</body>
</html>
