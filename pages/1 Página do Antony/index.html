<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pokémon</title>

    
  <link rel="stylesheet" href="styles.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  
  <div class="main-wrapper">
    

    <div class="roberto">
      <h1>Pokémon</h1>
    </div>

 
    <img src="../../assets/pokemon/logo.png" alt="Logo Pokémon">


    <div class="form-container">
      <ul class="nav nav-tabs" id="formTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Registrar</button>
        </li>
      </ul>

      <div class="tab-content">

        <div class="tab-pane fade show active" id="login" role="tabpanel">
          <form onsubmit="return handleLogin()">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>

            <button type="submit">Entrar</button>
          </form>
        </div>
        <div class="tab-pane fade" id="register" role="tabpanel">
          <form onsubmit="return handleRegister()">
            <label for="newUser">Novo Usuário</label>
            <input type="text" id="newUser" name="newUser" required>

            <label for="newPass">Nova Senha</label>
            <input type="password" id="newPass" name="newPass" required>

            <button type="submit">Registrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-bottom" id="mainNavbar" style="display: none;">
    <div class="container">
      <a class="navbar-brand" href="#">POKÉDEX</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="../1 Página do Antony/index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="../2 Página do Paulo/index.html">Lista dos Pokémons</a></li>
          <li class="nav-item"><a class="nav-link" href="../3 Página do Jorge/index.html">Altura</a></li>
          <li class="nav-item"><a class="nav-link" href="../4 Páginan do Rafael/index.html">Peso</a></li>
          <li class="nav-item"><a class="nav-link" href="../5 Página do Gustavo/index.html">Vantagens</a></li>
          <li class="nav-item"><a class="nav-link" href="../6 Página do vine/index.html">Tipo</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <script src="script.js"></script>
</body>
</html>
