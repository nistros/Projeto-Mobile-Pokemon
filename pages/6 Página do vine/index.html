<body>

  <meta charset="UTF-8">
  <title>Pesquisar Pokémon</title>
  <style>
      body {
          background-color: #2d4d66;
          color: rgb(0, 0, 0);
          font-family: monospace;
          text-align: center;
          padding-top: 50px;
      }
      input {
          padding: 8px;
          font-size: 16px;
          border: 2px solid orange;
          border-radius: 5px;
          outline: none;
      }
      button {
          padding: 8px 15px;
          font-size: 16px;
          background-color: orange;
          border: none;
          border-radius: 5px;
          cursor: pointer;
      }
      img {
          margin-top: 20px;
          width: 150px;
      }
      .info {
          margin-top: 20px;
          background-color: rgba(255, 255, 255, 0.1);
          padding: 15px;
          border-radius: 10px;
          display: inline-block;
          text-align: left;
          max-width: 400px;
      }
  </style>
</head>
<body>

  <h1><img src=" ./assets/pesquisa pokemon.png" alt=""></h1>
  <input type="text" id="pokemonName" placeholder="Digitar nome do bicho">
  <button onclick="buscarPokemon()">achar</button>

  <div id="resultado"></div> 

  <script>
      async function buscarPokemon() {
          const nome = document.getElementById('pokemonName').value.toLowerCase().trim();
          const resultado = document.getElementById('resultado');
          resultado.innerHTML = '';

          if (!nome) {
              resultado.innerHTML = '<p>Digita o nome do pokémon né home!</p>';
              return;
          }

          try {
              // Requisição principal
              const resposta = await fetch(`https://pokeapi.co/api/v2/pokemon/${nome}`);
              if (!resposta.ok) throw new Error('Pokémon não encontrado');
              const dados = await resposta.json();

              // Pega os tipos
              const tipos = dados.types.map(t => t.type.name).join(', ');

              // Pega habilidades (poderes)
              const poderes = dados.abilities.map(h => h.ability.name).join(', ');

              // Busca curiosidade em inglês
              const especieResp = await fetch(dados.species.url);
              const especieDados = await especieResp.json();
              const curiosidadeEN = especieDados.flavor_text_entries.find(
                  entry => entry.language.name === "en"
              )?.flavor_text.replace(/\f/g, ' ') || "No curiosity available";

              // Mostra tudo
              resultado.innerHTML = `
              
                  <h2>${dados.name.toUpperCase()}</h2>
                  <img src="${dados.sprites.front_default}" alt="${dados.name}">
            
                  <div class="info">
                      <p><strong>Tipo:</strong> ${tipos}</p>
                      <p><strong>Curiosidade:</strong> ${curiosidadeEN}</p>
                      <p><strong>Poderes:</strong> ${poderes}</p>
                  </div>
                  
              `;
          } catch (error) {
              resultado.innerHTML = `<p>❌ escreve certo seu burro!</p>`;
          }
      } 

  </script>
    
    <script src="script.js"></script>
