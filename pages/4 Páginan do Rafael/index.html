<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Completa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="pokedex">
            <div class="search-container">
                <input type="text" id="pokemon-search" placeholder="Digite o nome ou número do Pokémon">
                <div class="suggestions" id="suggestions"></div>
            </div>
           
            <div class="screen">
                <div class="pokemon-image">
                    <img id="pokemon-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png" alt="Pokémon">
                </div>
               
                <div class="pokemon-info">
                    <h2 class="pokemon-name" id="pokemon-name">Bulbasaur</h2>
                    <span class="pokemon-number" id="pokemon-number">#001</span>
                   
                    <div class="pokemon-types" id="pokemon-types">
                        <span class="type type-grass">Grama</span>
                        <span class="type type-poison">Veneno</span>
                    </div>
                   
                    <div class="pokemon-stats">
                        <div class="stat">Altura: <span id="height">0.7</span> m</div>
                        <div class="stat">Peso: <span id="weight">6.9</span> kg</div>
                    </div>
                   
                    <div class="pokemon-description" id="description">
                        Pokémon semente que cresce absorvendo nutrientes da terra e do sol.
                    </div>
                </div>
            </div>
           
            <div class="controls">
                <button class="btn" id="prev-btn">← Anterior</button>
                <button class="btn btn-select" id="random-btn">Aleatório</button>
                <button class="btn" id="next-btn">Próximo →</button>
            </div>
        </div>
    </div>

    <!-- Navbar no rodapé -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-bottom">
        <div class="container">
            <a class="navbar-brand pokemon-font" href="#">POKÉDEX</a class= a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Lista dos Pokémons</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Altura</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Peso</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Vantagens</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Tipo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Bootstrap JS e jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
