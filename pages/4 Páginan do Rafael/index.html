<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon - Navbar Responsiva</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Espaço para a navbar não cobrir conteúdo */
        body {
            padding-top: 56px; /* Espaço para navbar desktop */
            padding-bottom: 60px; /* Espaço para navbar mobile */
            min-height: 100vh;
        }
        
        /* Estilo da navbar */
        .pokemon-navbar {
            background-color: #343a40 !important;
            transition: all 0.3s ease;
        }
        
        /* Media Queries para responsividade */
        @media (min-width: 992px) {
            /* Desktop - Navbar no topo */
            .pokemon-navbar {
                position: fixed;
                top: 0;
                bottom: auto;
            }
            body {
                padding-bottom: 0;
            }
        }
        
        @media (max-width: 991.98px) {
            /* Mobile - Navbar no rodapé */
            .pokemon-navbar {
                position: fixed;
                bottom: 0;
                top: auto;
            }
            body {
                padding-top: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Conteúdo principal -->
    <div class="container mt-4">
        <h1 class="text-center mb-4">Pokédex</h1>
        <p>Conteúdo da página aqui...</p>
    </div>

    <!-- Navbar responsiva -->
    <nav class="navbar navbar-expand-lg navbar-dark pokemon-navbar">
        <div class="container">
            <a class="navbar-brand" href="#">POKÉMON</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="../1 Página do Antony/index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="../2 Página do Paulo/index.html">Lista dos Pokémons</a></li>
                    <li class="nav-item"><a class="nav-link" href="../3 Página do Jorge/index.html">Altura</a></li>
                    <li class="nav-item"><a class="nav-link" href="../4 Páginan do Rafael/index.html">Peso</a></li>
                    <li class="nav-item"><a class="nav-link" href="../5 Página do Gustavo/index.html">Vantagens</a></li>
                    <li class="nav-item"><a class="nav-link" href="../6 Página do vine/index.html">Tipo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Bootstrap JS + Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
