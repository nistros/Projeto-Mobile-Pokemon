<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Completa</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <h1>Pokédex Completa</h1>
            <div class="search-form">
                <input type="text" class="search-input" id="pokemonInput" placeholder="Digite o nome do Pokémon">
                <button class="search-button" onclick="filterPokemon()">Buscar</button>
            </div>
            <div class="filter-controls">
                <select id="typeFilter" class="filter-select" onchange="filterPokemon()">
                    <option value="">Todos os Tipos</option>
                    <!-- Tipos serão preenchidos por JavaScript -->
                </select>
                <select id="generationFilter" class="filter-select" onchange="filterPokemon()">
                    <option value="">Todas as Gerações</option>
                    <option value="1">Geração 1</option>
                    <option value="2">Geração 2</option>
                    <option value="3">Geração 3</option>
                    <option value="4">Geração 4</option>
                    <option value="5">Geração 5</option>
                    <option value="6">Geração 6</option>
                    <option value="7">Geração 7</option>
                    <option value="8">Geração 8</option>
                    <option value="9">Geração 9</option>
                </select>
            </div>
            <div id="errorMessage" class="error-message"></div>
        </div>
        
        <div id="loading" class="loading">Carregando Pokémon...</div>
        
        <div id="pokemonGrid" class="pokemon-grid">
            <!-- Pokémon serão carregados aqui -->
        </div>
    </div>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-bottom" id="mainNavbar" >
        <div class="container">
          <a class="navbar-brand" href="#">POKÉDEX</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link active" href="../1 Página do Antony/index.html">Início</a></li>
              <li class="nav-item"><a class="nav-link" href="../2 Página do Paulo/index.html">Lista dos Pokémons</a></li>
              <li class="nav-item"><a class="nav-link" href="../3 Página do Jorge/index.html">Altura</a></li>
              <li class="nav-item"><a class="nav-link" href="../4 Páginan do Rafael/index.html">Peso</a></li>
              <li class="nav-item"><a class="nav-link" href="../5 Página do Gustavo/index.html">Vantagens</a></li>
              <li class="nav-item"><a class="nav-link" href="../6 Página do vine/index.html">Tipo</a></li>
            </ul>
          </div>
        </div>
      </nav>
      
    <script src="script.js"></script>
</body>
</html>
